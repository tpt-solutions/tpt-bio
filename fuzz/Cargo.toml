[package]
name = "tpt-bio-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.tpt-bio-seq]
path = "../tpt-bio-seq"

[dependencies.tpt-bio-core]
path = "../tpt-bio-core"

# A separate workspace keeps fuzzing dependencies out of the main build.
[workspace]
members = ["."]

[[bin]]
name = "bgzf_decompress"
path = "fuzz_targets/bgzf_decompress.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fastq_parse"
path = "fuzz_targets/fastq_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sam_parse"
path = "fuzz_targets/sam_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bam_read"
path = "fuzz_targets/bam_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bai_read"
path = "fuzz_targets/bai_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vcf_read"
path = "fuzz_targets/vcf_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bcf_read"
path = "fuzz_targets/bcf_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tabix_read"
path = "fuzz_targets/tabix_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fasta_fai"
path = "fuzz_targets/fasta_fai.rs"
test = false
doc = false
bench = false
