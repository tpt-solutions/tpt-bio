[workspace]
resolver = "3"
# fuzz/ is a separate workspace so libFuzzer stays a tooling dependency.
# See docs/dependency-audit.md.
exclude = ["fuzz"]
members = [
    "tpt-bio-core",
    "tpt-bio-seq",
    "tpt-bio-vision",
    "tpt-bio-pipeline",
    "tpt-bio-cli",
    "bindings/tpt-bio-py",
]
default-members = [
    "tpt-bio-core",
    "tpt-bio-seq",
    "tpt-bio-vision",
    "tpt-bio-pipeline",
    "tpt-bio-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# tpt-simd requires Rust 1.95.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
readme = "README.md"

[workspace.dependencies]
# Internal crates
tpt-bio-core = { path = "tpt-bio-core", version = "0.1.0" }
tpt-bio-seq = { path = "tpt-bio-seq", version = "0.1.0" }
tpt-bio-vision = { path = "tpt-bio-vision", version = "0.1.0" }
tpt-bio-pipeline = { path = "tpt-bio-pipeline", version = "0.1.0" }

# tpt-solutions substrate (MIT OR Apache-2.0 on crates.io)
tpt-simd = "0.1.1"
tpt-strata = "0.1.0"

# tpt-crypto is pre-release and not on crates.io. Pin a reviewed commit.
tpt-crypto-hash = { version = "0.1.0", git = "https://github.com/tpt-solutions/tpt-crypto", rev = "e08fafb0389e36759d3691810bb9ea484ba41abf" }

# Permissive third-party crates (MIT OR Apache-2.0 unless noted)
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
memmap2 = "0.9"
rayon = "1.10"
crossbeam = "0.8"
libm = "0.2"
clap = { version = "4.6", features = ["derive"] }
pyo3 = { version = "0.30", default-features = false, features = ["macros", "abi3-py39"] }
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
tiff = "0.9"
ndarray = "0.16"
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap_complete = "4.5"
clap_mangen = "0.2"
proptest = "1"
serde_json = "1"
criterion = "0.5"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Sequence and image code is full of casts that are range-checked or that
# convert between BAM/BGZF field widths. Each one is reviewed individually.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

# target-lexicon is Apache-2.0 WITH LLVM-exception upstream, which the policy rejects.
# This MIT-only clean-room replacement is used instead. PyO3's build tree needs it.
[patch.crates-io]
target-lexicon = { git = "https://github.com/tpt-solutions/target-lexicon-mit", rev = "297f442a451c1406252bb428702eecc5be596473" }
