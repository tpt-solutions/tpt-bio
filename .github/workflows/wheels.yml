# Builds Python wheels for the tpt-bio bindings (bindings/tpt-bio-py) with maturin-action
# on Linux, macOS and Windows.
#
# Manual dispatch only (workflow_dispatch). Wheels are uploaded as workflow artifacts
# and nothing else.
#
# PUBLISHING IS INTENTIONALLY ABSENT. There is no PyPI upload, no release and no
# trusted-publishing step here. Adding one is a separate, deliberate decision.

name: Wheels (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: wheels (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.os == 'macos-latest' && 'universal2-apple-darwin' || 'x86_64' }}
          command: build
          args: --release --out dist --interpreter 3.9 3.10 3.11 3.12 3.13
          working-directory: bindings/tpt-bio-py
          sccache: "false"
          manylinux: auto
      - name: Upload wheels as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: bindings/tpt-bio-py/dist/*.whl
          if-no-files-found: error
          retention-days: 14
