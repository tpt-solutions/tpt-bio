# Informational performance run. Benchmarks the tpt-bio-seq parsers with criterion
# and keeps the raw criterion output as a workflow artifact.
#
# This workflow never fails on a regression: the bench step is `continue-on-error`,
# and nothing compares against a stored baseline. Read the artifact by hand.
# It publishes nothing (no release, tag, crate or package upload).
#
# Runs weekly and on manual dispatch. Shared CI runners are noisy, so treat the
# numbers as trends across runs, not as absolute throughput.

name: Perf (informational)

on:
  schedule:
    # Mondays 04:00 UTC.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: criterion parsers (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Run criterion benches (informational, does not gate)
        id: bench
        continue-on-error: true
        run: cargo bench -p tpt-bio-seq --bench parsers -- --warm-up-time 1 --measurement-time 3
      - name: Report bench outcome
        if: always()
        run: |
          echo "Bench step outcome: ${{ steps.bench.outcome }}"
          echo "This job is informational. A failed or slow run does not block anything."
      - name: Upload criterion output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-parsers-${{ github.run_number }}
          path: target/criterion/
          if-no-files-found: warn
          retention-days: 90
