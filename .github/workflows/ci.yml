name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Nightly run: catches new advisories and toolchain drift between pushes.
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  no-std:
    name: no_std build (tpt-bio-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p tpt-bio-core --no-default-features --target thumbv7em-none-eabihf
      - run: cargo test -p tpt-bio-core --no-default-features

  msrv:
    name: MSRV (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  python-bindings:
    name: Python bindings (separate workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/tpt-bio-py
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: bindings/tpt-bio-py

  zero-ffi:
    name: no -sys crates in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Fail if a C-library -sys or -ffi crate is in the dependency tree
        # Deliberate exclusions, both listed in docs/zero-ffi.md:
        # - tpt-bio-py (the Python bindings) is excluded from the tree. It links
        #   the Python C API through pyo3-ffi, which is an expected FFI link for an
        #   extension module. Every other workspace crate is checked.
        # - windows-sys is Microsoft's raw OS API binding, pulled in by std-adjacent
        #   crates on Windows. It wraps no third-party C library, so it is excluded.
        run: |
          if cargo tree --workspace --exclude tpt-bio-py --edges normal,build --prefix none \
              | grep -E '^[a-zA-Z0-9_]+(-[a-zA-Z0-9_]+)*-(sys|ffi) ' \
              | grep -v '^windows-sys ' ; then
            echo "A -sys or -ffi crate is in the dependency tree; the project must stay zero-FFI." >&2
            exit 1
          fi
