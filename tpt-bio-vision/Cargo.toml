[package]
name = "tpt-bio-vision"
description = "Biological image I/O, segmentation and feature extraction for tpt-bio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["bioimaging", "image-analysis", "segmentation", "microscopy", "zarr"]
categories = ["science", "multimedia::images"]

[features]
# Forces tpt-simd's scalar kernels, to test the fallback path on any CPU.
scalar-only = ["tpt-simd/scalar-only"]
# Browser WebGPU ray casting. Only builds for wasm32.
webgpu = ["dep:js-sys", "dep:web-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures"]

[dependencies]
tpt-bio-core.workspace = true
tpt-bio-seq.workspace = true
tpt-crypto-hash.workspace = true
tpt-simd.workspace = true
image.workspace = true
tiff.workspace = true
ndarray.workspace = true
quick-xml.workspace = true
serde.workspace = true
serde_json.workspace = true
flate2.workspace = true

[lints]
workspace = true

# The CPU renderer runs rows in parallel. The browser build is single-threaded, so it
# keeps the serial loop.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon.workspace = true

# Browser-only dependencies, used by the `webgpu` feature.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
    "Document", "Gpu", "GpuAdapter", "GpuAutoLayoutMode", "GpuBindGroup", "GpuBindGroupDescriptor",
    "GpuBindGroupEntry", "GpuBindGroupLayout", "GpuBufferBinding", "GpuBuffer", "GpuBufferDescriptor", "GpuCommandBuffer",
    "GpuCommandEncoder", "GpuComputePassEncoder", "GpuComputePipeline", "GpuComputePipelineDescriptor",
    "GpuDevice", "GpuProgrammableStage", "GpuQueue", "GpuShaderModule", "GpuShaderModuleDescriptor",
    "HtmlCanvasElement", "Navigator", "Window",
] }
